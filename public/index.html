<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="nav">
      <div class="nav-inner">
        <button class="brand" data-view="feed" aria-label="Home">Instagram</button>
        <input id="searchInput" class="search" placeholder="Search" />
        <nav class="nav-actions">
          <button data-view="feed" title="Home">Home</button>
          <button data-view="messages" title="Messages">DM</button>
          <button id="newPostBtn" title="Create">+</button>
          <button data-view="explore" title="Explore">Explore</button>
          <button data-view="notifications" title="Notifications">Alerts <span id="notifBadge" class="badge hidden">0</span></button>
          <button data-view="saved" title="Saved">Saved</button>
          <button data-view="profile" title="Profile">Profile</button>
          <button id="themeBtn" title="Toggle theme">Theme</button>
          <button id="authBtn" class="auth-btn">Log in</button>
        </nav>
      </div>
    </header>

    <main class="layout">
      <section class="main-col">
        <section id="stories" class="stories card"></section>
        <section id="storyCreator" class="card composer hidden">
          <h3>Add to your story</h3>
          <form id="storyForm">
            <input type="url" name="image" placeholder="Story image URL (https://...)" required />
            <button type="submit">Share story</button>
          </form>
        </section>
        <section id="composer" class="card composer hidden">
          <h3>Create post</h3>
          <form id="postForm">
            <input type="file" name="image" accept="image/*" />
            <input type="url" name="imageUrl" placeholder="Or image URL" />
            <select name="filter" aria-label="Image filter">
              <option value="none">Filter: None</option>
              <option value="clarendon">Clarendon</option>
              <option value="gingham">Gingham</option>
              <option value="moon">Moon</option>
              <option value="lark">Lark</option>
              <option value="reyes">Reyes</option>
              <option value="juno">Juno</option>
              <option value="slumber">Slumber</option>
              <option value="aden">Aden</option>
              <option value="perpetua">Perpetua</option>
            </select>
            <textarea name="caption" placeholder="Write a caption..." maxlength="2200"></textarea>
            <button type="submit">Share</button>
          </form>
        </section>
        <section id="view-feed"></section>
        <div id="feedSentinel" class="feed-sentinel hidden" aria-hidden="true"></div>
        <section id="view-explore" class="hidden"></section>
        <section id="view-notifications" class="hidden"></section>
        <section id="view-saved" class="hidden"></section>
        <section id="view-messages" class="hidden"></section>
        <section id="view-profile" class="hidden"></section>
        <section id="view-search" class="hidden"></section>
      </section>

      <aside class="side-col">
        <div id="meCard" class="card side-user"></div>
        <div class="card side-box">
          <h4>Suggestions For You</h4>
          <div id="suggestions"></div>
        </div>
        <footer class="side-footer">Instagram Clone • Autonomous Build • Local Demo</footer>
      </aside>
    </main>

    <dialog id="authDialog">
      <form id="authForm" method="dialog">
        <h3 id="authTitle">Log in</h3>
        <input name="username" placeholder="Username" required minlength="3" />
        <input name="name" placeholder="Name (signup)" />
        <input name="password" type="password" placeholder="Password" required minlength="6" />
        <div class="row">
          <button id="authSubmit" value="default">Continue</button>
          <button id="authToggle" type="button">Need an account?</button>
        </div>
        <p id="authError" class="error"></p>
      </form>
    </dialog>

    <dialog id="profileEditDialog">
      <form id="profileEditForm" method="dialog">
        <h3>Edit profile</h3>
        <input name="name" placeholder="Name" maxlength="80" />
        <textarea name="bio" placeholder="Bio" maxlength="150"></textarea>
        <input name="avatar" placeholder="Avatar URL (https://...)" maxlength="500" />
        <div class="row">
          <button id="profileSaveBtn" value="default">Save</button>
          <button type="button" onclick="document.getElementById('profileEditDialog').close()">Cancel</button>
        </div>
        <p id="profileEditError" class="error"></p>
      </form>
    </dialog>

    <dialog id="storyDialog" class="story-dialog">
      <div class="story-view">
        <button id="storyPrev" type="button" aria-label="Previous">‹</button>
        <div class="story-frame">
          <div id="storyMeta" class="story-meta"></div>
          <img id="storyImage" alt="Story" />
        </div>
        <button id="storyNext" type="button" aria-label="Next">›</button>
        <button id="storyClose" type="button" class="story-close" aria-label="Close">×</button>
      </div>
    </dialog>

    <dialog id="postDialog" class="post-dialog">
      <div id="postDialogBody"></div>
      <button id="postDialogClose" type="button" class="story-close" aria-label="Close">x</button>
    </dialog>

    <script src="/js/app.js" type="module"></script>
  </body>
</html>
